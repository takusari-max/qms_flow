<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base target="_top">
<title>QMS フロー図エディタ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #1e1e2e;
    color: #cdd6f4;
    overflow: hidden;
  }

  /* ===== ヘッダー / ツールバー ===== */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: #181825;
    border-bottom: 1px solid #313244;
    flex-wrap: wrap;
    min-height: 48px;
  }

  #toolbar .toolbar-title {
    font-weight: 700;
    font-size: 14px;
    color: #cba6f7;
    margin-right: 12px;
    white-space: nowrap;
  }

  #toolbar .separator {
    width: 1px;
    height: 24px;
    background: #45475a;
    margin: 0 4px;
  }

  #toolbar .group-label {
    font-size: 10px;
    color: #6c7086;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-right: 2px;
  }

  .btn {
    padding: 5px 10px;
    border: 1px solid #45475a;
    border-radius: 6px;
    background: #313244;
    color: #cdd6f4;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover {
    background: #45475a;
    border-color: #585b70;
  }
  .btn:active {
    background: #585b70;
  }
  .btn.accent {
    background: #cba6f7;
    color: #1e1e2e;
    border-color: #cba6f7;
  }
  .btn.accent:hover {
    background: #b4befe;
    border-color: #b4befe;
  }

  /* ===== メインエリア ===== */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* エディタペイン */
  #editor-pane {
    display: flex;
    flex-direction: column;
    width: 50%;
    min-width: 200px;
    background: #1e1e2e;
  }

  #editor-pane .pane-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: #181825;
    border-bottom: 1px solid #313244;
    font-size: 12px;
    color: #a6adc8;
  }

  #svg-editor {
    flex: 1;
    width: 100%;
    padding: 12px;
    border: none;
    outline: none;
    resize: none;
    background: #1e1e2e;
    color: #cdd6f4;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.5;
    tab-size: 2;
  }

  /* ドラッグ用分割バー */
  #divider {
    width: 6px;
    cursor: col-resize;
    background: #313244;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  #divider:hover, #divider.active {
    background: #cba6f7;
  }

  /* プレビューペイン */
  #preview-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 200px;
    background: #ffffff;
  }

  #preview-pane .pane-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: #f5f5f5;
    border-bottom: 1px solid #e0e0e0;
    font-size: 12px;
    color: #666;
  }

  #preview-container {
    flex: 1;
    overflow: auto;
    padding: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  #preview-container svg {
    max-width: 100%;
    height: auto;
  }

  #preview-container .error-msg {
    color: #e64553;
    background: #fee;
    border: 1px solid #e64553;
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 13px;
    font-family: monospace;
    white-space: pre-wrap;
    max-width: 100%;
  }

  /* ===== フッター ===== */
  #footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: #181825;
    border-top: 1px solid #313244;
    font-size: 11px;
    color: #6c7086;
  }

  #footer .status-msg {
    transition: color 0.3s;
  }
  #footer .status-msg.success {
    color: #a6e3a1;
  }

  /* ===== トースト通知 ===== */
  #toast {
    position: fixed;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #313244;
    color: #cdd6f4;
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 1000;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== プレビュークリック → コードジャンプ ===== */
  #preview-container svg *:not(defs *) { cursor: pointer; }

  .svg-click-highlight {
    pointer-events: none;
    animation: clickHighlightFade 1.5s ease-out forwards;
  }
  @keyframes clickHighlightFade {
    0%, 70% { stroke-opacity: 1; }
    100% { stroke-opacity: 0; }
  }

  /* ===== 座標グリッド ===== */
  .coord-grid line { stroke: #ccc; stroke-width: 0.5; }
  .coord-grid line.major { stroke: #aaa; stroke-width: 1; }
  .coord-grid text { fill: #999; font-size: 9px; font-family: monospace; pointer-events: none; }
  #btn-grid.active { background: #cba6f7; color: #1e1e2e; border-color: #cba6f7; }

  /* ===== クリックヘルパー（線のヒットエリア拡大） ===== */
  .click-helper { pointer-events: stroke; cursor: pointer; }
</style>
</head>
<body>

<!-- ツールバー -->
<div id="toolbar">
  <span class="toolbar-title">QMS フロー図エディタ</span>
  <div class="separator"></div>

  <span class="group-label">基本</span>
  <button class="btn" onclick="insertShape('start')" title="開始/終了（角丸長方形）">開始/終了</button>
  <button class="btn" onclick="insertShape('process')" title="プロセス（長方形）">プロセス</button>
  <button class="btn" onclick="insertShape('decision')" title="判断（ひし形）">判断</button>
  <button class="btn" onclick="insertShape('arrow')" title="矢印（接続線）">矢印</button>

  <div class="separator"></div>
  <span class="group-label">拡張</span>
  <button class="btn" onclick="insertShape('document')" title="書類（波型下辺）">書類</button>
  <button class="btn" onclick="insertShape('database')" title="データベース（円柱）">DB</button>
  <button class="btn" onclick="insertShape('data')" title="データ/入出力（平行四辺形）">入出力</button>
  <button class="btn" onclick="insertShape('manual')" title="手動操作（台形）">手動操作</button>
  <button class="btn" onclick="insertShape('predefined')" title="定義済み処理（二重線長方形）">定義済処理</button>
  <button class="btn" onclick="insertShape('swimlane')" title="スイムレーン（区画）">スイムレーン</button>

  <div class="separator"></div>
  <span class="group-label">操作</span>
  <button class="btn" onclick="insertShape('text')" title="テキストラベル">テキスト</button>
  <button class="btn" id="btn-grid" onclick="toggleGrid()" title="座標グリッド表示/非表示">座標</button>
  <button class="btn" onclick="loadSample()" title="サンプルを読み込み">サンプル</button>
  <button class="btn" onclick="clearEditor()" title="エディタをクリア">クリア</button>
  <button class="btn accent" onclick="copySvg()" title="SVGコードをコピー">コピー</button>
</div>

<!-- メインエリア -->
<div id="main">
  <!-- エディタ -->
  <div id="editor-pane">
    <div class="pane-header">
      <span>コード</span>
      <span id="line-info">行: 1 / 列: 1</span>
    </div>
    <textarea id="svg-editor" spellcheck="false" placeholder="ここにSVGコードを入力..."></textarea>
  </div>

  <!-- 分割バー -->
  <div id="divider"></div>

  <!-- プレビュー -->
  <div id="preview-pane">
    <div class="pane-header">
      <span>プレビュー</span>
      <span id="preview-status"></span>
    </div>
    <div id="preview-container"></div>
  </div>
</div>

<!-- フッター -->
<div id="footer">
  <span id="status-msg">準備完了</span>
  <span>QMS Flow Editor v1.0</span>
</div>

<!-- トースト通知 -->
<div id="toast"></div>

  };

  // ===== サンプルフロー図 =====
  var sampleSvg = [
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620">',
    '  <!-- 矢印マーカー定義 -->',
    '  <defs>',
    '    <marker id="arrowhead" markerWidth="10" markerHeight="7"',

    '  </defs>',
    '',

    '',

    '',
    '  <!-- 判断: 承認? -->',
    '  <polygon points="200,280 270,320 200,360 130,320"',
    '           fill="#f9e2af" stroke="#df8e1d" stroke-width="2"/>',
    '  <text x="200" y="325" text-anchor="middle" font-size="13" fill="#1e1e2e">承認?</text>',

  // ===== リアルタイムプレビュー =====
  var debounceTimer = null;

  function updatePreview() {
    var code = editor.value.trim();
    if (!code) {
      previewContainer.innerHTML = '<div style="color:#999;font-size:14px;text-align:center;margin-top:40px;">コードを入力するとプレビューが表示されます</div>';
      previewStatus.textContent = '';
      return;
    }

    try {
      var parser = new DOMParser();

      if (code.match(/^\s*<svg[\s>]/i)) {
        // === SVGモード ===
        var svgDoc = parser.parseFromString(code, 'image/svg+xml');
        var errorNode = svgDoc.querySelector('parsererror');
        if (errorNode) {
          previewContainer.innerHTML = '<div class="error-msg">' + escapeHtml(errorNode.textContent || 'SVG パースエラー') + '</div>';
          previewStatus.textContent = 'エラー';
          previewStatus.style.color = '#e64553';
        } else {
          previewContainer.innerHTML = '';
          var svgNode = svgDoc.documentElement;
          document.adoptNode(svgNode);
          previewContainer.appendChild(svgNode);
          postProcessSvg();
          previewStatus.textContent = '正常 (SVG)';
          previewStatus.style.color = '#40a02b';
        }

      } else if (code.match(/^\s*</)) {
        // === HTMLモード ===
        var htmlDoc = parser.parseFromString(code, 'text/html');
        var svgElements = htmlDoc.querySelectorAll('svg');

        if (svgElements.length === 0) {
          previewContainer.innerHTML = '<div class="error-msg">SVG要素が見つかりません</div>';
          previewStatus.textContent = 'SVGなし';
          previewStatus.style.color = '#e64553';
        } else {
          previewContainer.innerHTML = '';
          for (var i = 0; i < svgElements.length; i++) {
            var el = svgElements[i];
            if (!el.getAttribute('xmlns')) {
              el.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            }
            var serializer = new XMLSerializer();
            var svgStr = serializer.serializeToString(el);
            var svgDoc2 = parser.parseFromString(svgStr, 'image/svg+xml');
            var err2 = svgDoc2.querySelector('parsererror');
            if (!err2) {
              var node = svgDoc2.documentElement;
              document.adoptNode(node);
              previewContainer.appendChild(node);
            }
          }
          postProcessSvg();
          previewStatus.textContent = '正常 (HTML, SVG: ' + svgElements.length + '個)';
          previewStatus.style.color = '#40a02b';
        }

      } else {
        // === JS実行モード ===
        executeJsPreview(code);
      }
    } catch (e) {
      previewContainer.innerHTML = '<div class="error-msg">' + escapeHtml(e.message) + '</div>';
      previewStatus.textContent = 'エラー';
      previewStatus.style.color = '#e64553';
    }
  }

  function executeJsPreview(code) {
    try {
      // === プリアンブル: 不足する関数・オブジェクトを提供 ===
      var preamble = [
        // (1) escH (HTMLエスケープ) をコード側で未定義の場合のみ提供
        'if(typeof escH==="undefined"){function escH(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\\"/g,"\\&quot;");}}',
        // (2) document.getElementById をモックし innerHTML 代入をキャプチャ
        'var __capturedSvg=null;',
        'var document={getElementById:function(){return{get innerHTML(){return __capturedSvg||"";},set innerHTML(v){__capturedSvg=v;}};}}; '
      ].join('\n');

      // === function宣言を正規表現で検出 ===
      var funcMatches = code.match(/function\s+(\w+)\s*\(/g) || [];
      var funcNames = [];
      for (var fi = 0; fi < funcMatches.length; fi++) {
        funcNames.push(funcMatches[fi].replace(/function\s+/, '').replace(/\s*\(/, ''));
      }

      // ヘルパー関数（_で始まる）を除外し、メイン関数だけを呼ぶ
      var mainFuncs = [];
      for (var mi = 0; mi < funcNames.length; mi++) {
        if (funcNames[mi].charAt(0) !== '_' && funcNames[mi] !== 'escH') {
          mainFuncs.push(funcNames[mi]);
        }
      }

      // === ポストアンブル: 関数を順に実行しSVGをキャプチャ ===
      var calls = '';
      for (var ci = 0; ci < mainFuncs.length; ci++) {
        calls += 'try{if(!__capturedSvg&&typeof ' + mainFuncs[ci] + '==="function"){' + mainFuncs[ci] + '();}}catch(__e){}\n';
      }
      var postamble = calls + 'return __capturedSvg||(typeof svg!=="undefined"?svg:null);';

      var wrappedCode = preamble + '\n' + code + '\n' + postamble;
      var fn = new Function(wrappedCode);
      var svgString = fn();

      if (!svgString || typeof svgString !== 'string') {
        previewContainer.innerHTML = '<div class="error-msg">JS実行完了しましたが、SVG出力が見つかりません。\n\n確認事項:\n・svg変数にSVG文字列が構築されているか\n・document.getElementById(...).innerHTML=svg でDOMに出力しているか\n\n検出した関数: ' + (mainFuncs.length > 0 ? mainFuncs.join(', ') : 'なし') + '</div>';
        previewStatus.textContent = 'SVG出力なし';
        previewStatus.style.color = '#e64553';
        return;
      }

      // === SVGをプレビューに表示 ===
      previewContainer.innerHTML = svgString;
      postProcessSvg();
      previewStatus.textContent = '正常 (JS実行)';
      previewStatus.style.color = '#40a02b';

    } catch (e) {
      var errMsg = e.message || String(e);
      var lineMatch = errMsg.match(/line (\d+)/i) || errMsg.match(/:(\d+):/);
      var lineInfo = lineMatch ? ' (行: ' + lineMatch[1] + ')' : '';
      previewContainer.innerHTML = '<div class="error-msg">JS実行エラー' + lineInfo + '\n\n' + escapeHtml(errMsg) + '</div>';
      previewStatus.textContent = 'JS実行エラー';
      previewStatus.style.color = '#e64553';
    }
  }

  function debouncedPreview() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(updatePreview, 300);
  }

  editor.addEventListener('input', debouncedPreview);

  // ===== カーソル位置表示 =====
  function updateLineInfo() {
    var val = editor.value;
    var pos = editor.selectionStart;
    var lines = val.substring(0, pos).split('\n');
    var line = lines.length;
    var col = lines[lines.length - 1].length + 1;
    lineInfo.textContent = '行: ' + line + ' / 列: ' + col;
  }

  editor.addEventListener('keyup', updateLineInfo);
  editor.addEventListener('click', updateLineInfo);

  // ===== Tab キーでインデント =====
  editor.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var start = this.selectionStart;
      var end = this.selectionEnd;
      var val = this.value;
      this.value = val.substring(0, start) + '  ' + val.substring(end);
      this.selectionStart = this.selectionEnd = start + 2;
      debouncedPreview();
    }
  });

  // ===== 図形テンプレート挿入 =====
  window.insertShape = function(type) {
    var snippet = shapes[type];
    if (!snippet) return;

    var val = editor.value;
    var pos = editor.selectionStart;

    // SVGタグの閉じタグ前に挿入、なければ末尾に追加
    var insertPos = pos;
    var prefix = '\n';
    var suffix = '\n';

    // もしエディタが空の場合、SVGラッパーごと挿入
    if (!val.trim()) {
      editor.value = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">\n' +
        '  <defs>\n' +
        '    <marker id="arrowhead" markerWidth="10" markerHeight="7"\n' +
        '            refX="10" refY="3.5" orient="auto" fill="#585b70">\n' +
        '      <polygon points="0 0, 10 3.5, 0 7"/>\n' +
        '    </marker>\n' +
        '  </defs>\n\n' +
        snippet + '\n' +
        '</svg>';
    } else {
      // カーソル位置に挿入
      editor.value = val.substring(0, insertPos) + prefix + snippet + suffix + val.substring(insertPos);
      editor.selectionStart = editor.selectionEnd = insertPos + prefix.length + snippet.length;
    }

    editor.focus();
    debouncedPreview();
    showToast(type + ' を挿入しました');
  };

  // ===== サンプル読み込み =====
  window.loadSample = function() {
    editor.value = sampleSvg;
    editor.scrollTop = 0;
    updatePreview();
    showToast('サンプルフロー図を読み込みました');
    setStatus('サンプル読み込み完了');
  };

  // ===== クリア =====
  window.clearEditor = function() {
    editor.value = '';
    previewContainer.innerHTML = '';
    previewStatus.textContent = '';
    editor.focus();
    setStatus('エディタをクリアしました');
  };

  // ===== SVGコピー =====
  window.copySvg = function() {
    var code = editor.value;
    if (!code.trim()) {
      showToast('コピーするコードがありません');
      return;
    }

    // navigator.clipboard が使えない場合のフォールバック
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(function() {
        showToast('SVGコードをコピーしました');
        setStatus('コピー完了');
      }).catch(function() {
        fallbackCopy(code);
      });
    } else {
      fallbackCopy(code);
    }
  };

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('SVGコードをコピーしました');
      setStatus('コピー完了');
    } catch (e) {
      showToast('コピーに失敗しました');
    }
    document.body.removeChild(ta);
  }

  // ===== 分割バーのドラッグ =====
  var isDragging = false;

  divider.addEventListener('mousedown', function(e) {
    isDragging = true;
    divider.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    var mainRect = document.getElementById('main').getBoundingClientRect();
    var newWidth = e.clientX - mainRect.left;
    var minW = 200;
    var maxW = mainRect.width - 200 - 6;
    newWidth = Math.max(minW, Math.min(maxW, newWidth));
    editorPane.style.width = newWidth + 'px';
  });

  document.addEventListener('mouseup', function() {
    if (isDragging) {
      isDragging = false;
      divider.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
  });

  // ===== ユーティリティ =====
  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function() {
      toastEl.classList.remove('show');
    }, 2000);
  }

  function setStatus(msg) {
    statusMsg.textContent = msg;
    statusMsg.classList.add('success');
    setTimeout(function() {
      statusMsg.classList.remove('success');
      statusMsg.textContent = '準備完了';
    }, 3000);
  }

  // ===== 座標グリッド =====
  var gridEnabled = false;

  window.toggleGrid = function() {
    gridEnabled = !gridEnabled;
    var btn = document.getElementById('btn-grid');
    if (gridEnabled) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
    updatePreview();
  };

  function injectCoordinateGrid(svgEl) {
    var ns = 'http://www.w3.org/2000/svg';
    // viewBox解析
    var vb = svgEl.getAttribute('viewBox');
    var minX = 0, minY = 0, w = 0, h = 0;
    if (vb) {
      var parts = vb.trim().split(/[\s,]+/);
      minX = parseFloat(parts[0]) || 0;
      minY = parseFloat(parts[1]) || 0;
      w = parseFloat(parts[2]) || 0;
      h = parseFloat(parts[3]) || 0;
    }
    if (!w || !h) {
      w = parseFloat(svgEl.getAttribute('width')) || 0;
      h = parseFloat(svgEl.getAttribute('height')) || 0;
    }
    if (!w || !h) {
      try { var bb = svgEl.getBBox(); w = bb.width + bb.x; h = bb.height + bb.y; } catch (e) { return; }
    }
    if (!w || !h) return;

    // グリッド間隔を自動決定
    var maxDim = Math.max(w, h);
    var step = maxDim > 800 ? 100 : maxDim > 300 ? 50 : 25;

    var g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'coord-grid');

    // 縦線 + Xラベル
    var startX = Math.ceil(minX / step) * step;
    for (var x = startX; x <= minX + w; x += step) {
      var line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', x);
      line.setAttribute('y1', minY);
      line.setAttribute('x2', x);
      line.setAttribute('y2', minY + h);
      if (x % (step * 2) === 0) line.setAttribute('class', 'major');
      g.appendChild(line);

      var label = document.createElementNS(ns, 'text');
      label.setAttribute('x', x + 2);
      label.setAttribute('y', minY + 10);
      label.textContent = x;
      g.appendChild(label);
    }

    // 横線 + Yラベル
    var startY = Math.ceil(minY / step) * step;
    for (var y = startY; y <= minY + h; y += step) {
      var hLine = document.createElementNS(ns, 'line');
      hLine.setAttribute('x1', minX);
      hLine.setAttribute('y1', y);
      hLine.setAttribute('x2', minX + w);
      hLine.setAttribute('y2', y);
      if (y % (step * 2) === 0) hLine.setAttribute('class', 'major');
      g.appendChild(hLine);

      var hLabel = document.createElementNS(ns, 'text');
      hLabel.setAttribute('x', minX + 2);
      hLabel.setAttribute('y', y - 2);
      hLabel.textContent = y;
      g.appendChild(hLabel);
    }

    // 最初の子要素として挿入（背景側）
    if (svgEl.firstChild) {
      svgEl.insertBefore(g, svgEl.firstChild);
    } else {
      svgEl.appendChild(g);
    }
  }

  // ===== クリックヘルパー（線のヒットエリア拡大） =====
  function addClickHelpers(svgEl) {
    var lines = svgEl.querySelectorAll('line, polyline');
    for (var i = 0; i < lines.length; i++) {
      // coord-grid内の線は除外
      if (lines[i].closest && lines[i].closest('.coord-grid')) continue;
      var parent = lines[i].parentNode;
      while (parent && parent !== svgEl) {
        if (parent.classList && parent.classList.contains('coord-grid')) break;
        parent = parent.parentNode;
      }
      if (parent !== svgEl) continue;

      var clone = lines[i].cloneNode(false);
      clone.setAttribute('stroke', 'transparent');
      clone.setAttribute('stroke-width', '12');
      clone.setAttribute('fill', 'none');
      clone.removeAttribute('marker-end');
      clone.removeAttribute('marker-start');
      clone.setAttribute('class', 'click-helper');
      lines[i].parentNode.insertBefore(clone, lines[i].nextSibling);
    }
  }

  // SVG描画後の共通後処理
  function postProcessSvg() {
    var svgs = previewContainer.querySelectorAll('svg');
    for (var i = 0; i < svgs.length; i++) {
      addClickHelpers(svgs[i]);
      if (gridEnabled) injectCoordinateGrid(svgs[i]);
    }
  }

  // ===== プレビュークリック → コードジャンプ =====

  // クリック対象の解析: 意味のあるSVG要素を特定
  function resolveClickTarget(element) {
    var el = element;

    // coord-grid内の要素は無視
    var check = el;
    while (check && check !== previewContainer) {
      if (check.classList && check.classList.contains('coord-grid')) return null;
      check = check.parentNode;
    }

    // click-helper → 元の線要素に差し替え
    if (el.classList && el.classList.contains('click-helper')) {
      el = el.previousElementSibling || el;
    }

    // 無視する要素
    while (el && el !== previewContainer) {
      var tag = el.tagName ? el.tagName.toLowerCase() : '';
      if (tag === 'svg' && el.parentNode === previewContainer) return null;
      if (tag === 'defs' || tag === 'marker') return null;
      // tspan → 親textに昇格
      if (tag === 'tspan') { el = el.parentNode; tag = el.tagName ? el.tagName.toLowerCase() : ''; }
      if (['rect', 'text', 'line', 'polygon', 'polyline', 'path', 'ellipse', 'circle'].indexOf(tag) >= 0) {
        break;
      }
      el = el.parentNode;
    }
    if (!el || el === previewContainer) return null;

    var tag = el.tagName.toLowerCase();
    var descriptor = { tagName: tag, text: '', attrs: {}, element: el };

    // テキスト内容を取得（自身 or 兄弟テキスト）
    if (tag === 'text') {
      descriptor.text = (el.textContent || '').trim();
    } else if (el.parentNode) {
      var siblings = el.parentNode.children;
      for (var i = 0; i < siblings.length; i++) {
        if (siblings[i].tagName && siblings[i].tagName.toLowerCase() === 'text') {
          descriptor.text = (siblings[i].textContent || '').trim();
          break;
        }
      }
    }

    // 座標属性を収集
    var attrNames = ['x', 'y', 'x1', 'y1', 'x2', 'y2', 'width', 'height', 'cx', 'cy', 'rx', 'ry', 'points', 'd'];
    for (var a = 0; a < attrNames.length; a++) {
      var v = el.getAttribute(attrNames[a]);
      if (v) descriptor.attrs[attrNames[a]] = v;
    }

    return descriptor;
  }

  // 検索パターン生成
  function buildSearchPatterns(descriptor) {
    var patterns = [];
    var code = editor.value;
    var isJsMode = !code.trim().match(/^\s*</);

    if (isJsMode) {
      // JSモード: 文字列リテラル内のテキスト検索
      if (descriptor.text) {
        patterns.push("'" + descriptor.text + "'");
        patterns.push('"' + descriptor.text + '"');
      }
      // 座標ペア検索
      if (descriptor.attrs.x && descriptor.attrs.y) {
        patterns.push(descriptor.attrs.x + ',' + descriptor.attrs.y);
      }
      if (descriptor.attrs.x1 && descriptor.attrs.y1) {
        patterns.push(descriptor.attrs.x1 + ',' + descriptor.attrs.y1 + ',' + descriptor.attrs.x2 + ',' + descriptor.attrs.y2);
      }
      if (descriptor.attrs.cx && descriptor.attrs.cy) {
        patterns.push(descriptor.attrs.cx + ',' + descriptor.attrs.cy);
      }
      if (descriptor.attrs.points) {
        // points属性の最初の座標ペアで検索
        var firstCoord = descriptor.attrs.points.trim().split(/\s+/)[0];
        if (firstCoord) patterns.push(firstCoord);
      }
    } else {
      // SVG/HTMLモード
      if (descriptor.text) {
        patterns.push('>' + descriptor.text + '<');
      }
      if (descriptor.attrs.x && descriptor.attrs.y) {
        patterns.push('x="' + descriptor.attrs.x + '"');
      }
      if (descriptor.attrs.x1) {
        patterns.push('x1="' + descriptor.attrs.x1 + '"');
      }
      if (descriptor.attrs.points) {
        patterns.push('points="' + descriptor.attrs.points);
      }
      if (descriptor.attrs.d) {
        // pathのd属性の先頭部分で検索
        var dShort = descriptor.attrs.d.substring(0, 20);
        patterns.push(dShort);
      }
    }

    return patterns;
  }

  // コード内検索
  function findInCode(patterns) {
    var code = editor.value;
    for (var i = 0; i < patterns.length; i++) {
      var idx = code.indexOf(patterns[i]);
      if (idx >= 0) {
        return { charIndex: idx, matchLength: patterns[i].length };
      }
    }
    return null;
  }

  // エディタの該当位置へジャンプ
  function navigateEditorToChar(charIndex, matchLength) {
    var code = editor.value;
    // 行の先頭と末尾を算出
    var lineStart = code.lastIndexOf('\n', charIndex - 1) + 1;
    var lineEnd = code.indexOf('\n', charIndex);
    if (lineEnd < 0) lineEnd = code.length;

    // 行番号算出
    var lineNum = code.substring(0, charIndex).split('\n').length;

    // 行全体を選択してハイライト
    editor.focus();
    editor.setSelectionRange(lineStart, lineEnd);

    // スクロール位置の調整（選択範囲が見えるように）
    var totalLines = code.split('\n').length;
    var lineHeight = editor.scrollHeight / totalLines;
    var targetScroll = (lineNum - 5) * lineHeight;
    if (targetScroll < 0) targetScroll = 0;
    editor.scrollTop = targetScroll;

    updateLineInfo();
    return lineNum;
  }

  // SVG要素にハイライト枠を表示
  function highlightSvgElement(element) {
    try {
      var svgRoot = element.closest ? element.closest('svg') : null;
      if (!svgRoot) {
        var p = element;
        while (p && p.tagName && p.tagName.toLowerCase() !== 'svg') p = p.parentNode;
        svgRoot = p;
      }
      if (!svgRoot || !svgRoot.tagName || svgRoot.tagName.toLowerCase() !== 'svg') return;

      var bbox = element.getBBox();
      var pad = 4;
      var ns = 'http://www.w3.org/2000/svg';
      var rect = document.createElementNS(ns, 'rect');
      rect.setAttribute('x', bbox.x - pad);
      rect.setAttribute('y', bbox.y - pad);
      rect.setAttribute('width', bbox.width + pad * 2);
      rect.setAttribute('height', bbox.height + pad * 2);
      rect.setAttribute('fill', 'none');
      rect.setAttribute('stroke', '#cba6f7');
      rect.setAttribute('stroke-width', '2.5');
      rect.setAttribute('stroke-dasharray', '6,3');
      rect.setAttribute('rx', '4');
      rect.classList.add('svg-click-highlight');
      svgRoot.appendChild(rect);

      setTimeout(function() {
        if (rect.parentNode) rect.parentNode.removeChild(rect);
      }, 1500);
    } catch (e) { /* ignore */ }
  }

  // メインクリックハンドラ
  function handlePreviewClick(e) {
    var target = e.target;
    if (!target || target === previewContainer) return;

    var descriptor = resolveClickTarget(target);
    if (!descriptor) return;

    var patterns = buildSearchPatterns(descriptor);
    if (patterns.length === 0) {
      showToast('対応するコードが見つかりません');
      return;
    }

    var match = findInCode(patterns);
    if (match) {
      var lineNum = navigateEditorToChar(match.charIndex, match.matchLength);
      highlightSvgElement(descriptor.element);
      setStatus('行 ' + lineNum + ' にジャンプしました');
    } else {
      showToast('対応するコードが見つかりません');
    }
  }

  // イベント委譲で登録
  previewContainer.addEventListener('click', handlePreviewClick);

  // ===== 初期化: サンプルを読み込み =====
  loadSample();

})();
</script>
</body>
</html>
